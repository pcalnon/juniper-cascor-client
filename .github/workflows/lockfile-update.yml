---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   juniper-cascor-client
# File Name:     lockfile-update.yml
# Author:        Paul Calnon
# Version:       0.1.0
#
# Date Created:  2026-04-27
# Last Modified: 2026-04-27
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Automatically updates requirements.lock when Dependabot pushes a dependency
#    update to a dependabot/pip/** branch. Runs uv pip compile to regenerate
#    the lockfile and commits the result so downstream consumers using the
#    pinned set stay in sync.
#
#    Uses CROSS_REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) so the push re-triggers CI.
#
# References:
#    - Roadmap CI-05 (Track 5B)
#####################################################################################################################################################################################################

name: Update Lockfile (Dependabot)

on:
  push:
    branches:
      - dependabot/pip/**

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update requirements.lock
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Checkout Code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python 3.14
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"

      - name: Install uv
        run: pip install uv==0.11.8

      - name: Regenerate requirements.lock
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-cascor-client - Regenerate Lockfile          ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # Write directly to requirements.lock so the autogenerated header
          # records "-o requirements.lock" rather than a temp path. --upgrade
          # is required for Dependabot bumps: when a transitive pin in the
          # current lockfile blocks the bumped direct dep, --constraint mode
          # without --upgrade would refuse to move it. Direct deps that
          # Dependabot updates land via pyproject.toml diffs.
          uv pip compile pyproject.toml \
            --extra dev \
            --upgrade \
            -o requirements.lock

      - name: Commit updated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "::notice::Lockfile already up to date — no commit needed"
          else
            git commit -m "[dependabot skip] Update requirements.lock"
            git push
          fi
