---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   juniper-cascor-client
# File Name:     lockfile-update.yml
# Author:        Paul Calnon
# Version:       0.1.1
#
# Date Created:  2026-04-27
# Last Modified: 2026-11-24
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Automatically updates requirements.lock when Dependabot pushes a dependency
#    update to a dependabot/pip/** branch. Runs uv pip compile to regenerate
#    the lockfile and commits the result so downstream consumers using the
#    pinned set stay in sync.
#
#    Uses CROSS_REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) so the push re-triggers CI.
#
#    Dependabot caveat (2026-07-28): Dependabot-triggered runs use the
#    Dependabot secret store, so the repo-scoped CROSS_REPO_DISPATCH_TOKEN is
#    EMPTY there and the checkout hard-fails on every dependabot/pip/** push.
#    The token-availability gate below turns that arm into a loud green no-op
#    until the Overtoad registers the same PAT under Settings -> Secrets ->
#    Dependabot. Mirrors juniper-canopy #476 / juniper-cascor #428 /
#    juniper-data #246.
#
# References:
#    - Roadmap CI-05 (Track 5B)
#####################################################################################################################################################################################################

name: Update Lockfile (Dependabot)

on:
  push:
    branches:
      - dependabot/pip/**

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update requirements.lock
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'

    steps:
      - name: Gate on CROSS_REPO_DISPATCH_TOKEN availability
        id: gate
        env:
          # Secrets are not readable in job/step `if:` expressions, so surface
          # presence (never the value) through env for the shell to branch on.
          HAVE_PAT: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
        run: |
          if [[ "${HAVE_PAT}" == "true" ]]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "::notice::CROSS_REPO_DISPATCH_TOKEN is not available to Dependabot-triggered runs (Dependabot secret store). Skipping auto-regen; the Lockfile Freshness CI gate still enforces staleness. Register the PAT under Settings -> Secrets -> Dependabot to re-enable."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::CROSS_REPO_DISPATCH_TOKEN is missing for a non-Dependabot run — secret misconfiguration."
            exit 1
          fi

      - name: Checkout Code
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          ref: ${{ github.ref }}

      - name: Set up Python 3.14
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"

      - name: Install uv
        if: steps.gate.outputs.proceed == 'true'
        run: pip install uv==0.11.8

      - name: Regenerate requirements.lock
        if: steps.gate.outputs.proceed == 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       juniper-cascor-client - Regenerate Lockfile          ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # Write directly to requirements.lock so the autogenerated header
          # records "-o requirements.lock" rather than a temp path. --upgrade
          # is required for Dependabot bumps: when a transitive pin in the
          # current lockfile blocks the bumped direct dep, --constraint mode
          # without --upgrade would refuse to move it. Direct deps that
          # Dependabot updates land via pyproject.toml diffs.
          uv pip compile pyproject.toml \
            --extra dev \
            --upgrade \
            -o requirements.lock

      # The regen commit is created through the GitHub API rather than by a local
      # `git commit` + `git push`, because GitHub SIGNS API-created commits and this repo
      # enforces required_signatures on the default branch (juniper-ml#1099).
      #
      # The old plain push did NOT fail: the ruleset is ~DEFAULT_BRANCH-scoped, so a push to
      # dependabot/pip/** succeeded and left an UNSIGNED commit in the branch's history. That
      # is harmless under a squash merge -- GitHub authors (and signs) the squash commit
      # itself -- but this repo also allows merge commits and rebase merges, and both of those
      # replay the original commit onto main, where required_signatures rejects it. The defect
      # has never fired here, and not because a lockfile was current: this workflow has never
      # run (no Dependabot pip branch has been pushed in this repo), and the repo tracks no
      # requirements.lock. If it does run, the regen step above writes a NEW, untracked
      # lockfile, which `git diff --quiet` below cannot see -- so this step would log "already
      # up to date" and commit nothing. The signed path stays unexercised until a lockfile is
      # committed.
      #
      # CROSS_REPO_DISPATCH_TOKEN stays the identity so the resulting commit still re-triggers
      # CI (GITHUB_TOKEN would not). Mirrors juniper-cascor / juniper-data / juniper-canopy,
      # and juniper-cascor-worker#180.
      - name: Commit updated lockfile (GitHub-signed, via API)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet -- requirements.lock; then
            echo "::notice::Lockfile already up to date — no commit needed"
            exit 0
          fi

          # expectedHeadOid makes this a compare-and-swap: if anything landed on the branch
          # since checkout, the mutation fails loudly rather than clobbering it (the old
          # `git push` had the same protection).
          HEAD_OID=$(git rev-parse HEAD)

          # Encode on its own line: a failure inside "$(...)" passed as a jq argument does
          # not trip `set -e`, and an empty payload would commit an empty lockfile (flood-3 §4).
          LOCK_B64=$(base64 -w0 requirements.lock)
          if [ -z "${LOCK_B64}" ]; then
            echo "::error::base64 produced an empty payload -- lockfile NOT committed"
            exit 1
          fi

          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg oid "${HEAD_OID}" \
            --arg contents "${LOCK_B64}" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "[dependabot skip] Update requirements.lock"},
                expectedHeadOid: $oid,
                fileChanges: {additions: [{path: "requirements.lock", contents: $contents}]}
              }}}' > /tmp/lockfile-commit.json

          # `gh api graphql` exits 1, not 0, on a response that carries GraphQL `errors`: it
          # writes the response to stdout, prints `gh: <message>` to stderr and returns a
          # silent error (cli/cli pkg/cmd/api/api.go, processResponse). An HTTP failure exits
          # 1 the same way (`gh: HTTP 502`, `gh: Bad credentials (HTTP 401)`). Called bare,
          # `set -e` ended the step on that exit, before the `.errors` check below could print
          # its diagnostic. Capture the exit status and stderr instead; the checks decide.
          # The same fix as juniper-canopy#814.
          GH_STATUS=0
          GH_STDERR=$({ gh api graphql --input /tmp/lockfile-commit.json > /tmp/lockfile-commit-result.json; } 2>&1) || GH_STATUS=$?

          # Print what gh printed, as the bare call did, with the token's value masked. The
          # substitution runs in the shell, so the token never reaches a command line.
          redact() {
            printf '%s\n' "${1//"${GH_TOKEN:-}"/***}"
          }
          if [ -n "${GH_STDERR}" ]; then
            redact "${GH_STDERR}" >&2
          fi

          if jq -e '.errors' /tmp/lockfile-commit-result.json > /dev/null 2>&1; then
            echo "::error::createCommitOnBranch failed — lockfile NOT committed:"
            redact "$(jq '.errors' /tmp/lockfile-commit-result.json)"
            echo "gh exited ${GH_STATUS}. Fix the cause above and re-run this job. It checks out the branch's current tip, so a branch that moved after checkout (an expectedHeadOid mismatch) needs only the re-run."
            exit 1
          fi

          if [ "${GH_STATUS}" -ne 0 ]; then
            echo "::error::gh api graphql failed (exit ${GH_STATUS}) with no GraphQL errors in the response, so this log cannot show whether the lock commit landed."
            if jq -e . /tmp/lockfile-commit-result.json > /dev/null 2>&1; then
              redact "$(jq . /tmp/lockfile-commit-result.json)"
            else
              echo "The response body is empty or not JSON; gh's message above is the error."
            fi
            echo "Check ${BRANCH} for the lock commit before re-running this job."
            if [[ "${GH_STDERR}" == *"(HTTP 401)"* ]]; then
              echo "HTTP 401: CROSS_REPO_DISPATCH_TOKEN is invalid or expired."
            fi
            exit 1
          fi

          jq -r '"Signed lockfile commit: " + .data.createCommitOnBranch.commit.url' \
            /tmp/lockfile-commit-result.json
