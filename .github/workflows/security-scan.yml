name: Scheduled Security Scan

on:
  schedule:
    - cron: "0 6 * * 1"  # Weekly on Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install "setuptools>=82" "bandit[sarif]" pip-audit
          pip install -e ".[test]"

      - name: Create reports directory
        run: mkdir -p reports/security

      - name: Run Bandit (SAST)
        run: |
          bandit -r juniper_cascor_client -f sarif -o reports/security/bandit.sarif --exit-zero
          bandit -r juniper_cascor_client --confidence-level medium --severity-level medium

      - name: Run pip-audit (Dependency Vulnerabilities)
        # --skip-editable: drop --strict (pip-audit otherwise treats
        # the editable juniper-cascor-client install as a fatal
        # "dependency not found on PyPI" since pre-release alphas
        # aren't always queryable by pip-audit's resolver). See
        # juniper-ml/.github/workflows/ci.yml for the same pattern.
        run: pip-audit --desc on --skip-editable

      - name: Upload Security Reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: always()
        with:
          name: security-reports
          path: reports/security/
          retention-days: 30
