# gitleaks configuration for juniper-cascor-client
#
# Validation finding V22 (notes/CI_VALIDATION_FINDINGS_2026-04-29.md
# in juniper-ml). gitleaks 8.x's heuristic ``generic-api-key`` rule
# matches several false positives in this repo:
#
#   1. tests/test_client.py — literal test fixtures like
#      ``"explicit-key-789"`` exercising the ``api_key`` argument
#      of ``JuniperCascorClient``. Two historical hits in commit
#      fa9423438be4d90922eb8cafe8c7c989eb0e66bb (2026-02-26).
#
#   2. juniper_cascor_client/testing/fake_ws_client.py — module
#      docstring containing the substring "client for
#      JuniperCascor", which the regex matches as if "client" were
#      a key name and "JuniperCascor" were the secret value.
#
# Both are documented test-double / placeholder content, not real
# credentials.
#
# Strategy: extend the default ruleset (so aws-keys, gcp-keys,
# github-pat, slack-bot-token, ssh-private-key, etc. all keep
# firing in production code) and add a TOP-LEVEL allowlist that
# exempts the two test-only paths plus an explicit
# placeholder-token regex. Top-level allowlist applies across all
# rules — appropriate here because:
#
#   * tests/ is dedicated to the test suite — no real credentials
#     should ever live there.
#   * juniper_cascor_client/testing/ is a public-ish submodule of
#     fakes/test-doubles for downstream consumers; same
#     no-real-credentials invariant applies.
#
# When you add new test-fixture credential strings, no change is
# needed — the allowlist already covers tests/ and testing/. If a
# new directory is created for fixtures elsewhere, add its glob to
# `paths` below.

[extend]
useDefault = true

[allowlist]
description = "Test fixtures and the in-package testing/ submodule use literal placeholder strings; gitleaks's heuristic generic-api-key rule false-positives on those."
paths = [
  '''tests/.*\.py$''',
  '''juniper_cascor_client/testing/.*\.py$''',
]
# Belt-and-suspenders: if a fixture matching this naming pattern
# leaks into another path, allowlist it by content too.
regexes = [
  '''(?i)(test|env|explicit|fixture|fake|dummy|sample)-key-[0-9]+''',
]
